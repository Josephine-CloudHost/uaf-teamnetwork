      - name: Validate frontend restore
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = ['icon-192.png','openEditContactModal','addInitiative','generateFinancialReport','createGroup','getOrCreateDM',"type: 'voice'","apiPost('notifyCall'","apiFetchAction('activeCall')"]
