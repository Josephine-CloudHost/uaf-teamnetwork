name: UAF Team Network v9.2 Frontend Restore

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-frontend:
    if: github.event.head_commit.message != 'UAF v9.2 frontend restore'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch index.html
        run: python tools/restore_frontend_v9_2.py
      - name: Validate frontend restore
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = ['icon-192.png','openEditContactModal','addInitiative','generateFinancialReport','createGroup','getOrCreateDM',"type: 'voice'","apiPost('notifyCall'","apiFetchAction('activeCall')"]
          for token in required:
              if token not in s:
                  raise SystemExit(f'Missing required hook: {token}')
          if 'startJitsiCall' in s or '<video' in s.lower():
              raise SystemExit('Video/Jitsi path detected; audio-only requirement failed.')
          if '\\n// ==================== RESTORED' in s:
              raise SystemExit('Literal backslash-n escaped into JavaScript restore block.')
          print('Frontend restore validation passed.')
          PY
      - name: Commit patched index and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/restore_frontend_v9_2.py .github/workflows/uaf-v9-2-frontend-restore.yml
          git rm .github/workflows/uaf-v9-2-frontend-restore.yml tools/restore_frontend_v9_2.py
          git commit -m "UAF v9.2 frontend restore"
          git push
