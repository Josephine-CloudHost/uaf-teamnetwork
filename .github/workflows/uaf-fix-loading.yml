name: UAF Fix Frontend Loading
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed restored JavaScript block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find(r'\\n// ==================== RESTORED v9.2 FEATURES ====================')
          anchor=s.find('// Settings Theme & Auth', start if start >= 0 else 0)
          if start >= 0 and anchor > start:
              block=s[start:anchor]
              # Convert only single escaped newline tokens into real source newlines.
              block=re.sub(r'(?<!\\)\\n', '\\n', block)
              s=s[:start]+block+s[anchor:]
              p.write_text(s,encoding='utf-8')
              print('Repaired malformed block')
          else:
              print('No malformed escaped block found; leaving file unchanged')
          # Hard validation: exactly one script block and valid JavaScript.
          import subprocess
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/scripts.js').write_text('\\n\\n'.join(scripts),encoding='utf-8')
          print('scripts:',len(scripts),'bytes:',len(s.encode()))
          subprocess.run(['node','--check','/tmp/scripts.js'],check=True)
          PY
      - name: Commit repair and remove diagnostic workflows
        run: |
          rm -f .github/workflows/uaf-v9-2-cleanup.yml .github/workflows/uaf-frontend-diagnose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix frontend loading JavaScript syntax'
            git push
          fi
