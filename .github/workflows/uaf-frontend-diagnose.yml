name: UAF Frontend Diagnose
on:
  push:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/scripts.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          print('script blocks:', len(scripts))
          print('index bytes:', len(s.encode()))
          print('restored markers:', s.count('RESTORED v9.2 FEATURES'))
          print('literal escaped newline markers:', s.count('\\\\n//'))
          print('video tags:', s.lower().count('<video'))
          print('jitsi refs:', s.lower().count('jitsi'))
          PY
          node --check /tmp/scripts.js
