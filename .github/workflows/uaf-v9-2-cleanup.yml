name: UAF Team Network Frontend Cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message != 'UAF v9.2 frontend cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate malformed restore block
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='// ==================== RESTORED v9.2 FEATURES ===================='
          bad='\\n'+marker
          if bad in s:
              start=s.index(bad)
              end=s.index('// Settings Theme & Auth', start)
              s=s[:start]+s[end:]
          first=s.find(marker)
          if first < 0:
              raise SystemExit('Restored feature block not found')
          second=s.find(marker, first+len(marker))
          while second >= 0:
              end=s.find('// Settings Theme & Auth', second)
              if end < 0:
                  raise SystemExit('Could not locate Settings anchor after duplicate block')
              s=s[:second]+s[end:]
              second=s.find(marker, first+len(marker))
          if s.count(marker) != 1 or bad in s:
              raise SystemExit('Cleanup validation failed')
          if 'startJitsiCall' in s or '<video' in s.lower():
              raise SystemExit('Video/Jitsi path detected')
          p.write_text(s,encoding='utf-8')
          print('Frontend cleanup passed')
          PY
      - name: Remove temporary files and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/uaf-v9-2-cleanup.yml tools/restore_frontend_v9_2.py || true
          git add -u
          git commit -m "UAF v9.2 frontend cleanup"
          git push
